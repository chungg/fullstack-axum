[package]
name = "fullstack-axum"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
config = "0.15.27"
garde = { version = "0.23.0", features = ["derive", "url"] }
minijinja = { version = "3.1.0" }
polars = { version = "0.55.2", features = ["lazy", "csv", "dtype-date", "json", "serde-lazy", "strings", "timezones"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "tracing"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
http-body-util = "0.1.5"
rstest = "0.29.0"
